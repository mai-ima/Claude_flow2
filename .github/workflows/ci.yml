name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ビルド/型チェック/テストは DB 接続不要（env.ts が既定値を持つ）
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      TZ: "Asia/Tokyo"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
